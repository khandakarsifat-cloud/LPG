[global]
repo1-path=/var/lib/lpg-backup/repository
repo1-retention-full=1
repo1-retention-archive-type=incr
repo1-retention-archive=1
repo1-retention-history=0
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=1
process-max=1
start-fast=y
archive-check=y
archive-copy=y
archive-timeout=180
log-level-console=warn
log-level-file=off
lock-path=/tmp/pgbackrest
spool-path=/tmp/pgbackrest-spool

[lpg]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=supabase_admin
pg1-database=postgres
