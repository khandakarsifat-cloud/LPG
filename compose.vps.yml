# Separate production configuration; the local compose.yml and .env stay unchanged.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  frontend:
    logging: *bounded-logging
    profiles: [frontend]
    mem_limit: 128m
  api-gw:
    logging: *bounded-logging
    mem_limit: 256m
    command: ["--concurrency", "2"]
    depends_on: !override
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
      realtime:
        condition: service_healthy
  db:
    logging: *bounded-logging
    mem_limit: 2560m
    shm_size: 768m
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=640MB
      - -c
      - effective_cache_size=1920MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_wal_size=2GB
      - -c
      - max_connections=80
      - -c
      - log_min_messages=warning
  auth:
    logging: *bounded-logging
    mem_limit: 192m
    environment:
      GOTRUE_DB_MAX_POOL_SIZE: "5"
  rest:
    logging: *bounded-logging
    mem_limit: 192m
    environment:
      PGRST_DB_POOL: "10"
  realtime:
    logging: *bounded-logging
    mem_limit: 384m
    networks:
      default:
        aliases: [realtime-dev.supabase-realtime]
    environment:
      ERL_AFLAGS: "+S 2:2 -proto_dist inet_tcp"
      DB_POOL_SIZE: "5"
  storage:
    logging: *bounded-logging
    mem_limit: 384m
    environment:
      DATABASE_POOL_MAX: "5"
  imgproxy:
    logging: *bounded-logging
    mem_limit: 128m
    environment:
      IMGPROXY_CONCURRENCY: "2"
  mailpit:
    logging: *bounded-logging
    profiles: [development]
    mem_limit: 96m
  studio:
    logging: *bounded-logging
    mem_limit: 384m
    depends_on:
      meta:
        condition: service_started
  meta:
    logging: *bounded-logging
    mem_limit: 192m
  functions:
    logging: *bounded-logging
    profiles: [functions]
    mem_limit: 256m
  supavisor:
    logging: *bounded-logging
    profiles: [pooler]
    mem_limit: 384m
  caddy:
    logging: *bounded-logging
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    depends_on:
      api-gw:
        condition: service_healthy
      attendance-receiver:
        condition: service_healthy
  attendance-receiver:
    image: node:24.20.0-alpine
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 32
    logging: *bounded-logging
    command: [node, --max-old-space-size=32, /app/server.mjs]
    volumes:
      - ./attendance-receiver/server.mjs:/app/server.mjs:ro
      - ./deploy/.attendance-token:/run/attendance-token:ro
    depends_on:
      rest:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  db-config:
    name: lpg_db-config
    external: true
  caddy-data:
  caddy-config:
